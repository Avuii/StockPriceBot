name: Application tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build dashboard and extension
        run: |
          npm ci --prefix frontend/dashboard
          npm run build --prefix frontend/dashboard
          npm ci --prefix frontend/extension
          npm run build --prefix frontend/extension
      - name: Build backend
        run: dotnet build PriceStockBot.slnx
      - name: Install Chromium
        shell: pwsh
        run: ./backend/tests/PriceStockBot.Tests/bin/Debug/net8.0/playwright.ps1 install --with-deps chromium
      - name: Run unit and browser tests
        env:
          RUN_BROWSER_TESTS: '1'
        run: dotnet test PriceStockBot.slnx --no-build
